<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pomodoro Timer</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>Pomodoro</h1>

    <div class="mode-tabs">
      <button class="mode-btn active" data-mode="work">Focus</button>
      <button class="mode-btn" data-mode="short">Short Break</button>
      <button class="mode-btn" data-mode="long">Long Break</button>
    </div>

    <div class="timer-ring">
      <svg viewBox="0 0 200 200" class="ring-svg">
        <circle class="ring-bg" cx="100" cy="100" r="90" />
        <circle class="ring-progress" cx="100" cy="100" r="90" />
      </svg>
      <div class="time-display" id="timeDisplay">25:00</div>
    </div>

    <div class="controls">
      <button id="startPauseBtn" class="primary-btn">Start</button>
      <button id="resetBtn" class="secondary-btn">Reset</button>
    </div>

    <div class="session-info">
      <span id="sessionCount">Session 1</span>
      <span class="dots" id="sessionDots"></span>
    </div>

    <details class="settings">
      <summary>Settings</summary>
      <div class="settings-grid">
        <label>
          Focus (min)
          <input type="number" id="workInput" min="1" max="90" value="25" />
        </label>
        <label>
          Short Break (min)
          <input type="number" id="shortInput" min="1" max="30" value="5" />
        </label>
        <label>
          Long Break (min)
          <input type="number" id="longInput" min="1" max="60" value="15" />
        </label>
        <label>
          Sessions before long break
          <input type="number" id="cyclesInput" min="1" max="10" value="4" />
        </label>
      </div>
      <label class="checkbox-row">
        <input type="checkbox" id="autoStartInput" />
        Auto-start next session
      </label>
    </details>
  </main>

  <script src="script.js"></script>
</body>
</html>
